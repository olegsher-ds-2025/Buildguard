name: buildguard

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: buildguard
      POSTGRES_PASSWORD: buildguard
      POSTGRES_DB: buildguard
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "buildguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buildguard
      MINIO_ROOT_PASSWORD: buildguard123
      # Real S3/MinIO requires explicit CORS before a browser can PUT/GET via
      # presigned URLs — discovered the hard way in M3 (curl never enforces
      # CORS, so it only surfaced once the upload flow was driven from an
      # actual page). This is the documented, version-stable way to enable
      # it for MinIO's whole API surface; add any deployed frontend origin
      # here too.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://localhost:5174"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 buildguard buildguard123 &&
      mc mb --ignore-existing local/buildguard-dev
      "

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://buildguard:buildguard@db:5432/buildguard
    working_dir: /repo/apps/api
    entrypoint: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    command: []

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://buildguard:buildguard@db:5432/buildguard
      JWT_ACCESS_SECRET: dev-only-change-me
      JWT_REFRESH_SECRET: dev-only-change-me-too
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: buildguard-dev
      S3_ACCESS_KEY: buildguard
      S3_SECRET_KEY: buildguard123
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  monitor:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP_NAME: monitor
        # Presigned upload/download URLs point at S3_ENDPOINT directly
        # (localhost:9000 from the browser's point of view), independent of
        # this — only calls to our own API go through VITE_API_BASE_URL.
        VITE_API_BASE_URL: http://localhost:3000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"

  admin:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP_NAME: admin
        VITE_API_BASE_URL: http://localhost:3000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5174:8080"

volumes:
  db-data:
  minio-data:
