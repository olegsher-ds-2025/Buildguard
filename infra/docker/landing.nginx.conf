# Landing-page server. The base image includes conf.d/*.conf inside `http {}`, so the http-level
# directives (limit_req_zone, map, log_format) below are valid here.

# Only the two public lead forms are proxied to the API, and at most 5 requests/min per client.
limit_req_zone $binary_remote_addr zone=leads:10m rate=5r/m;

# Analytics-free logging: client IP truncated to /24 (IPv4) or /48 (IPv6) before it hits the log.
map $remote_addr $ip_truncated {
    ~^(\d+\.\d+\.\d+)\.\d+$                                 "$1.0";
    ~^(?<p>[0-9a-fA-F]+:[0-9a-fA-F]*:[0-9a-fA-F]*):         "$p::";
    default                                                 "-";
}
log_format landing '$ip_truncated [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# One Cache-Control source for the whole server: add_header in a nested location would drop the
# server-level security headers, so cache rules are a map instead.
map $uri $landing_cache {
    default                  "public, max-age=86400";
    ~*\.html$                "no-cache";
    ~^/assets/fonts/         "public, max-age=31536000, immutable";
    ~^/api/                  "no-store";
    /healthz                 "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Behind Nginx Proxy Manager the container's own host:port must never leak into the /owners -> /owners/ redirect.
    absolute_redirect off;

    access_log /dev/stdout landing;

    # Nginx Proxy Manager (and anything else on the LAN) sets X-Forwarded-For; trust it only from private ranges.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/ld+json image/svg+xml text/plain application/xml;

    add_header Cache-Control $landing_cache always;
    add_header Content-Security-Policy "default-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /404.html {
        internal;
    }

    # Docker's embedded DNS plus a variable in proxy_pass: the name is resolved per request, so nginx
    # starts (and the static site works) even when the api container is down or not created yet.
    location ~ ^/api/v1/leads/(register|contact)$ {
        limit_except POST { deny all; }
        limit_req zone=leads burst=4 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Everything else under /api/ (auth, projects, ...) is not exposed on this hostname.
    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
