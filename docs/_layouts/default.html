<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" dir="{{ page.dir | default: 'ltr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% if site.url %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🏗️</text></svg>">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --accent: #0969da;
      --code-bg: #f6f8fa;
      --table-stripe: #f6f8fa;
      --max: 62rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --border: #3d444d;
        --accent: #4493f8;
        --code-bg: #161b22;
        --table-stripe: #161b22;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Hebrew",
            "Helvetica Neue", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 2.5rem 1.25rem 6rem; }
    header.site {
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
      padding-bottom: 1rem;
    }
    header.site a.home {
      color: var(--muted);
      text-decoration: none;
      font-size: .875rem;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    header.site a.home:hover { color: var(--accent); }
    h1, h2, h3, h4 { line-height: 1.25; margin: 2em 0 .6em; font-weight: 600; }
    h1 { font-size: 2rem; margin-top: 0; }
    h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    h3 { font-size: 1.2rem; }
    h4 { font-size: 1rem; }
    p, ul, ol { margin: 0 0 1rem; }
    li { margin: .25rem 0; }
    a { color: var(--accent); }
    hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    blockquote {
      margin: 0 0 1rem;
      padding: 0 1rem;
      border-inline-start: .25rem solid var(--border);
      color: var(--muted);
    }
    code, pre, kbd {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: .875em;
    }
    :not(pre) > code {
      background: var(--code-bg);
      padding: .15em .4em;
      border-radius: 6px;
    }
    div.highlighter-rouge, pre.highlight, pre:not(.mermaid) {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    div.highlighter-rouge { margin: 0 0 1rem; overflow: hidden; }
    div.highlighter-rouge pre, pre:not(.mermaid) {
      margin: 0;
      padding: 1rem;
      overflow-x: auto;
      border: 0;
    }
    div.highlighter-rouge div.highlight { background: none; }
    /* Tables are wrapped in .table-scroll by the script below so wide tables
       scroll on their own instead of forcing the page sideways. */
    .table-scroll { overflow-x: auto; margin: 0 0 1.25rem; }
    table { border-collapse: collapse; width: 100%; font-size: .9375rem; }
    th, td {
      border: 1px solid var(--border);
      padding: .5rem .75rem;
      text-align: start;
      vertical-align: top;
    }
    thead th { background: var(--table-stripe); font-weight: 600; }
    tbody tr:nth-child(even) { background: var(--table-stripe); }
    img { max-width: 100%; }
    pre.mermaid {
      background: none;
      border: 0;
      padding: 0;
      margin: 1.5rem 0;
      text-align: center;
      overflow-x: auto;
    }
    pre.mermaid:not([data-processed]) { visibility: hidden; }
    footer.site {
      border-top: 1px solid var(--border);
      margin-top: 4rem;
      padding-top: 1rem;
      color: var(--muted);
      font-size: .875rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site">
      <p>{{ site.description }}</p>
    </footer>
  </div>

  <script type="module">
    // Kramdown renders ```mermaid fences as a highlighted code block, not as
    // the <pre class="mermaid"> element Mermaid looks for. Convert them first,
    // reading textContent so HTML entities come back as literal characters.
    const blocks = document.querySelectorAll(
      'div.language-mermaid, pre > code.language-mermaid, code.language-mermaid'
    );
    for (const block of blocks) {
      // Jekyll 4 emits <pre><code class="language-mermaid">, GitHub Pages'
      // Jekyll 3.9 emits a rouge <div class="language-mermaid"> wrapper. Both
      // are matched above; skip anything a previous iteration already replaced.
      if (!block.isConnected) continue;
      const code = block.matches('code') ? block : block.querySelector('code');
      if (!code) continue;
      const target = block.matches('div.language-mermaid') ? block : (block.closest('pre') || block);
      const pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = code.textContent.replace(/\n$/, '');
      target.replaceWith(pre);
    }

    if (document.querySelector('pre.mermaid')) {
      const { default: mermaid } = await import(
        'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'
      );
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      mermaid.initialize({
        startOnLoad: false,
        theme: dark ? 'dark' : 'default',
        securityLevel: 'strict',
        fontFamily: 'inherit'
      });
      await mermaid.run({ querySelector: 'pre.mermaid' });
    }
  </script>
  <script>
    // Wide tables scroll within their own container.
    for (const table of document.querySelectorAll('main table')) {
      const box = document.createElement('div');
      box.className = 'table-scroll';
      table.replaceWith(box);
      box.appendChild(table);
    }
  </script>
</body>
</html>
